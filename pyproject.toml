[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hugrgate"
version = "0.1.0"
description = "Local-first, model-agnostic probabilistic decision runtime"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Volmarr Wyrd" }]
keywords = ["decisions", "probabilistic", "local-first", "ml", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "numpy>=1.24"]
onnx = ["onnxruntime>=1.16"]
nli = ["transformers>=4.30", "torch>=2.0"]
llm = ["llama-cpp-python>=0.2"]
server = ["fastapi>=0.104", "uvicorn>=0.24", "httpx>=0.27"]
bench = ["numpy>=1.24"]
test = ["pytest>=7.0"]
typecheck = ["mypy>=1.0"]

[project.scripts]
hugrgate = "hugrgate.cli:main"
hugrgate-server = "hugrgate.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["hugrgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
