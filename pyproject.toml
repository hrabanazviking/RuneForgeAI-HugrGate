[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hugrgate"
version = "0.1.0"
description = "Local-first, model-agnostic probabilistic decision runtime"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Volmarr Wyrd" }]
keywords = ["decisions", "probabilistic", "local-first", "ml", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "numpy>=1.24"]
onnx = ["onnxruntime>=1.16"]
server = ["fastapi>=0.104", "uvicorn>=0.24"]
bench = ["numpy>=1.24"]
test = ["pytest>=7.0"]

[project.scripts]
hugrgate = "hugrgate.cli:main"
hugrgate-server = "hugrgate.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["hugrgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
